<script>
  /**
   * ==========================================
   * js_main.html (全アニメーション・連動エラー完全撃破版)
   * ==========================================
   */

  document.addEventListener("touchstart", function(){}, {passive: true});

  var masterDataList=[], currentCandidate=null, searchTimeout=null, currentStep=1, maxReachedStep=1, isFirstStepCompleted=false, editingStep=null, openEditPanels=[], selectedRouteIndex=null;
  var isDateDirty=false, isBusDirty=false, isRouteDirty=false, isConfirmDirty=false, isWeatherDirty=false, hasSubmitted=false;
  window.lastFetchedDate=null; window.isEnforcingErrors=false; window.pendingWeatherClose=null;
  var originalValues={}, selectedCards=[], isSelectionMode=false, pressTimer=null, touchStartX=0, touchStartY=0;
  
  window.selectedRouteDuration = 15;
  window.selectedRouteFirstWalk = 5;
  window.selectedRouteDepStop = "宮戸橋";
  window.selectedRouteArrStop = "目的地最寄り";
  window.currentRouteData = [];

  window.captureOriginalValues = function() {
    originalValues = { step1: currentCandidate ? currentCandidate.placeId : null, step2: document.getElementById('date-input').value, step3: document.getElementById('bus-time-select').value, step4: document.getElementById('stay-select').value, step5: selectedRouteIndex };
  }
  window.checkValuesChanged = function() {
    return (originalValues.step1 !== (currentCandidate ? currentCandidate.placeId : null) || originalValues.step2 !== document.getElementById('date-input').value || originalValues.step3 !== document.getElementById('bus-time-select').value || originalValues.step4 !== document.getElementById('stay-select').value || originalValues.step5 !== selectedRouteIndex);
  }

  window.preparePanelForAnimation = function(panel) {
    if(!panel) return;
    panel.classList.remove('hidden');
    panel.style.display = 'flex';
    panel.style.visibility = 'hidden';
    panel.style.opacity = '0';
  };

  window.showToast = function(msg) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.innerText = msg;
    toast.classList.add('toast-show');
    setTimeout(function() { toast.classList.remove('toast-show'); }, 3000);
  };

  window.getSvgForWeather = function(iconOrCode) {
    if (!iconOrCode) return window.getSvgForIcon('weather', 'w-8 h-8');
    if (iconOrCode.includes("☀️")) return '<span class="text-3xl">☀️</span>';
    if (iconOrCode.includes("🌧️") || iconOrCode.includes("☂️")) return '<span class="text-3xl">🌧️</span>';
    if (iconOrCode.includes("⛈️")) return '<span class="text-3xl">⛈️</span>';
    if (iconOrCode.includes("❄️")) return '<span class="text-3xl">❄️</span>';
    if (iconOrCode.includes("⛅") || iconOrCode.includes("🌤️")) return '<span class="text-3xl">🌤️</span>';
    if (iconOrCode.includes("☁️") || iconOrCode.includes("🌥️")) return '<span class="text-3xl">☁️</span>';
    return window.getSvgForIcon('weather', 'w-8 h-8');
  };

  window.startRouteSearch = function() {
    var routeCandidatesDiv = document.getElementById('route-candidates');
    var btnNextRoute = document.getElementById('btn-next-route');
    if (!routeCandidatesDiv) return;

    if (!currentCandidate || !document.getElementById('date-input').value || !document.getElementById('bus-time-select').value) {
      routeCandidatesDiv.innerHTML = '<div class="text-amber-400 font-bold p-4 text-center w-full">目的地・出発日・バス時間を先に設定してください</div>';
      if (btnNextRoute) btnNextRoute.disabled = true;
      return;
    }

    routeCandidatesDiv.innerHTML = '<div class="text-gray-400 font-bold p-8 text-center w-full flex flex-col items-center justify-center"><span class="animate-spin text-3xl mb-2">⏳</span><span>最適ルートを検索中...</span></div>';
    if (btnNextRoute) btnNextRoute.disabled = true;

    var dateStr = document.getElementById('date-input').value;
    var timeStr = document.getElementById('bus-time-select').value;
    var destAddr = currentCandidate.address || currentCandidate.parsedAddress;

    var successHandler = function(res) {
      if (res && res.success && res.routes && res.routes.length > 0) {
        var h = "";
        window.currentRouteData = res.routes;
        res.routes.forEach(function(route, idx) {
          var isSelected = (selectedRouteIndex === idx);
          var selectedClass = isSelected ? "selected" : "";
          h += '<div class="route-card ' + selectedClass + '" onclick="window.selectRouteCard(' + idx + ')">';
          h += '<div class="flex items-center justify-between mb-2">';
          h += '<span class="text-blue-400 font-black text-lg">ルート ' + (idx + 1) + '</span>';
          h += '<span class="bg-gray-800 text-gray-200 text-xs font-bold px-2.5 py-1 rounded-full border border-gray-700">約 ' + route.durationMinutes + ' 分</span>';
          h += '</div>';
          h += '<div class="text-sm text-gray-300 whitespace-pre-wrap font-medium leading-relaxed">' + route.summary + '</div>';
          h += '</div>';
        });
        routeCandidatesDiv.innerHTML = h;

        if (selectedRouteIndex === null || selectedRouteIndex >= res.routes.length) {
          window.selectRouteCard(0);
        } else {
          window.selectRouteCard(selectedRouteIndex);
        }
      } else {
        routeCandidatesDiv.innerHTML = '<div class="text-red-400 font-bold p-6 text-center w-full">該当ルートが見つかりませんでした。<br><span class="text-xs text-gray-500 font-normal">' + (res ? res.message : '通信エラー') + '</span></div>';
        if (btnNextRoute) btnNextRoute.disabled = true;
      }
    };

    var failHandler = function(err) {
      routeCandidatesDiv.innerHTML = '<div class="text-red-400 font-bold p-6 text-center w-full">ルート取得に失敗しました</div>';
      if (btnNextRoute) btnNextRoute.disabled = true;
    };

    if (typeof google !== 'undefined') {
      google.script.run.withSuccessHandler(successHandler).withFailureHandler(failHandler).getRoutesForWeb(dateStr, timeStr, destAddr);
    } else {
      setTimeout(function() {
        successHandler({
          success: true,
          routes: [
            { summary: "バス (朝01) [宮戸橋  ⇨  朝霞駅南口]\n⇩\n徒歩 3分\n(15分 / 3.2km)", durationMinutes: 15, firstWalkMinutes: 5, depStop: "宮戸橋", arrStop: "朝霞駅南口" },
            { summary: "バス (朝02) [宮戸橋  ⇨  市内循環]\n⇩\n徒歩 5分\n(20分 / 3.8km)", durationMinutes: 20, firstWalkMinutes: 8, depStop: "宮戸橋", arrStop: "あさか医療センター前" }
          ]
        });
      }, 800);
    }
  };

  window.selectRouteCard = function(idx) {
    selectedRouteIndex = idx;
    var cards = document.querySelectorAll('.route-card');
    cards.forEach(function(card, i) {
      if (i === idx) card.classList.add('selected');
      else card.classList.remove('selected');
    });

    if (window.currentRouteData && window.currentRouteData[idx]) {
      var route = window.currentRouteData[idx];
      window.selectedRouteDuration = route.durationMinutes;
      window.selectedRouteFirstWalk = route.firstWalkMinutes || 5;
      window.selectedRouteDepStop = route.depStop || "宮戸橋";
      window.selectedRouteArrStop = route.arrStop || "目的地最寄り";
    }

    window.validateStep();
    window.updatePreview();
    window.updateBadges();
  };

  window.getStepIdStr = function(s) { return s === 'weather' ? 'weather' : String(s); }
  window.getBadgeIdStr = function(s) { return s === 'weather' ? 'weather' : (s === 5 ? 'route' : (s === 6 ? 'confirm' : String(s))); }
  window.getErrorQueue = function() {
    var q = [];
    if(isDateDirty) q.push(2); if(isBusDirty) q.push(3); if(isRouteDirty) q.push(5); if(isWeatherDirty) q.push('weather'); if(isConfirmDirty) q.push(6);
    return q;
  }
  window.openErrorPanelIfNeeded = function() {
    var q = window.getErrorQueue(); if(q.length > 0) { window.tapBadge(q[0]); return true; } return false;
  }

  window.formatTimeNoZero = function(timeStr) {
    if(!timeStr || timeStr.trim() === "" || timeStr === "--:--") return "--:--";
    var parts = timeStr.replace(/'/g, "").split(":");
    return (parts.length >= 2) ? parseInt(parts[0], 10) + ":" + parts[1] : timeStr;
  }

  window.getSvgForIcon = function(type, cls) {
    var b = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="' + cls + '">';
    if(type==='bus') return b + '<path d="M 2,18 L 2,6 C 2,4 4,3 7,3 L 17,3 C 20,3 22,5 22,8 L 22,18 Z M 2,11 L 22,11 M 8,3 L 8,11 M 15,3 L 15,11" /><circle cx="7" cy="18" r="2" /><circle cx="17" cy="18" r="2" /></svg>';
    if(type==='hospital') return b + '<path d="M3 21h18 M9 8h1 M9 12h1 M9 16h1 M14 8h1 M14 12h1 M14 16h1 M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16" /></svg>';
    if(type==='clock') return b + '<circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>';
    if(type==='home') return b + '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>';
    if(type==='calendar') return b + '<rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>';
    if(type==='send') return b + '<rect x="3" y="11" width="8" height="12" rx="1.5" /><line x1="5.5" y1="21" x2="8.5" y2="21" /><path d="M 12 8 A 3 3 0 0 1 15 11" /><path d="M 12 5 A 6 6 0 0 1 18 11" /><path d="M 12 2 A 9 9 0 0 1 21 11" /></svg>'; 
    if(type==='map') return b + '<path d="M 3 6 L 9 3 L 15 6 L 21 3 L 21 18 L 15 21 L 9 18 L 3 21 Z M 9 3v15 M 15 6v15" /></svg>';
    if(type==='list') return b + '<line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" /></svg>';
    if(type==='search') return b + '<circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>';
    if(type==='trash') return b + '<polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>';
    if(type==='teacup') return b + '<path d="M5 8h12v5a6 6 0 0 1-12 0V8z M17 10h1.5a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3h-1.5 M2 19h18 M8 3v3 M13 3v3" /></svg>';
    if(type==='cancel') return b + '<line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>';
    if(type==='weather') return b + '<circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></svg>';
    if(type==='walk') return '<svg viewBox="0 0 24 24" fill="currentColor" class="' + cls + '"><path d="M14.5 7.5 C13 7.5 12 8 11 9 L9 13 L11 14 L12 11 L12.5 11 L10 19 L12.5 20 L14.5 14 L16 19 L18.5 18 L16.5 13 L15.5 9 L17 11 L19 9.5 C18 8.5 16 7.5 14.5 7.5 Z" /><circle cx="14" cy="4.5" r="2.5" /></svg>';
    if(type==='train-front') return b + '<rect x="4" y="3" width="16" height="15" rx="3" /><rect x="6" y="6" width="12" height="6" rx="1" fill="currentColor" stroke="none" /><circle cx="8" cy="15" r="1" /><circle cx="16" cy="15" r="1" /><path d="M 7 18 L 5 21 M 17 18 L 19 21 M 5 21h14" /></svg>';
    if(type==='flag') return b + '<rect x="3" y="4" width="18" height="12" rx="1" /><circle cx="12" cy="10" r="3" fill="#ef4444" stroke="none" /><path d="M3 4v16" /></svg>';
    return '';
  }

  window.makeWeatherBadge = function(wStr) {
    if(!wStr || wStr.trim() === "" || wStr === "---") return '';
    var parts = wStr.split(/\s+/), icon = parts[0] || '🌤️', temp = parts[1] || '--℃';
    return '<div class="absolute top-[-14px] right-[40px] z-40 bg-gray-950 border-2 border-amber-400 rounded-lg py-1 px-1.5 flex flex-col items-center leading-none shadow-md shadow-black shrink-0">' +
             '<span class="text-sm">' + icon + '</span>' +
             '<span class="text-[9px] font-black text-gray-200 mt-0.5">' + temp + '</span>' +
           '</div>';
  }
  
  window.makeWeatherBadgeHorizontal = function(wStr) {
    if(!wStr || wStr.trim() === "" || wStr === "---") return '';
    var parts = wStr.split(/\s+/), icon = parts[0] || '🌤️', temp = parts[1] || '--℃';
    return '<div class="absolute -top-9 right-[-10px] z-40 bg-gray-950 border-2 border-amber-400 rounded-lg py-1 px-1.5 flex flex-col items-center leading-none shadow-md shadow-black shrink-0">' +
             '<span class="text-sm">' + icon + '</span>' +
             '<span class="text-[9px] font-black text-gray-200 mt-0.5">' + temp + '</span>' +
           '</div>';
  }

  window.getTimelinePanelHTML = function(id, startTime, busTime, arrTime, wStart, wBus, wArr) {
    function makeBadge(color, text, iconHtml, timeStr, wId, zIndex, isLeftEnd) {
      var svgPath = 'M 8,1 Q 1,1 1,8 L 1,64 Q 1,71 8,71 L 82,71 L 98,36 L 82,1 Z';
      var fillPath = 'M 68,1 L 82,1 L 98,36 L 82,71 L 68,71 Z';
      var mlClass = !isLeftEnd ? "ml-[-12px]" : "";

      return '<div class="flex-1 relative h-[72px] z-' + zIndex + ' ' + mlClass + ' pt-1 pb-1">' +
               '<div id="' + wId + '"></div>' +
               '<svg class="absolute inset-0 w-full h-full drop-shadow-md" preserveAspectRatio="none" viewBox="0 0 100 72">' +
                 '<path d="' + svgPath + '" fill="#030712" stroke="' + color + '" stroke-width="2" vector-effect="non-scaling-stroke" />' +
                 '<path d="' + fillPath + '" fill="' + color + '" stroke="none" />' +
               '</svg>' +
               '<div class="relative z-10 w-full h-full flex items-center">' +
                 '<div class="w-[68%] flex flex-col items-center justify-center pl-1">' +
                   iconHtml +
                   '<span class="font-black text-[20px] tracking-tight leading-none mt-1" style="color:' + color + '">' + timeStr + '</span>' +
                 '</div>' +
                 '<div class="w-[32%] flex items-center justify-center pt-0.5 pr-3 relative right-[3px]">' +
                   '<span style="writing-mode:vertical-rl;text-orientation:upright;" class="text-[14px] font-black tracking-widest text-gray-950">' + text + '</span>' +
                 '</div>' +
               '</div>' +
             '</div>';
    }

    var h = '<div class="flex mt-2 w-full relative select-none pt-2">';
    h += makeBadge('#6b7280', '出 発', window.getSvgForIcon('home', 'w-8 h-8 text-gray-400'), window.formatTimeNoZero(startTime), 'weather-start-' + id, 30, true);
    h += makeBadge('#3b82f6', 'バ ス', window.getSvgForIcon('bus', 'w-9 h-9 text-blue-400'), window.formatTimeNoZero(busTime), '', 20, false);
    h += makeBadge('#10b981', '到 着', window.getSvgForIcon('hospital', 'w-8 h-8 text-green-400'), window.formatTimeNoZero(arrTime), 'weather-arr-' + id, 10, false);
    h += '</div>';
    return h;
  }

  window.getHorizontalTimelineHTML = function(startTime, busTime, arrTime, wStart, wBus, wArr, stayText, retTime, wRet) {
    var dName = window.currentCandidate ? window.currentCandidate.name : "目的地";
    var depStop = window.selectedRouteDepStop || "宮戸橋";
    var arrStop = window.selectedRouteArrStop || "目的地最寄り";
    
    var h = '<div class="flex items-start justify-between w-full text-gray-200 select-none px-0.5 relative pb-3 pt-8">';
    h += '<div class="absolute top-[65px] left-[10%] right-[10%] h-[3px] bg-gray-700 z-0"></div>';

    function makeNode(id, iconType, iconColor, label, timeStr, timeColor, wBadge, popMsg) {
      return '<div class="flex flex-col items-center gap-2 z-10 relative cursor-pointer group" onclick="window.showTimelineMsg(\'' + id + '\', this)">' +
               wBadge +
               '<div id="' + id + '" class="absolute -top-11 whitespace-nowrap text-xs font-bold text-gray-950 bg-gray-200 px-3 py-1.5 rounded-lg shadow-lg z-[9999] opacity-0 transition-opacity pointer-events-none drop-shadow-md">' + popMsg + '<div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-t-[8px] border-t-gray-200 border-r-[6px] border-r-transparent"></div></div>' +
               '<div class="w-[60px] h-[60px] bg-gray-900 border-[3px] border-' + iconColor + ' rounded-full flex items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.5)] bg-gray-950 group-active:scale-95 transition-transform">' +
                 window.getSvgForIcon(iconType, 'w-8 h-8 text-' + iconColor) +
               '</div>' +
               '<span class="text-xs font-black text-gray-400 w-[60px] truncate text-center">' + label + '</span>' +
               '<span class="font-black text-lg text-' + timeColor + ' leading-none mt-[-2px]">' + window.formatTimeNoZero(timeStr) + '</span>' +
             '</div>';
    }

    h += makeNode('msg-start', 'home', 'gray-500', '自宅', startTime, 'gray-400', window.makeWeatherBadgeHorizontal(wStart), '自宅を出発');
    h += makeNode('msg-bus', 'bus', 'blue-500', 'バス停', busTime, 'blue-300', '', depStop + ' ⇨ ' + arrStop);
    h += makeNode('msg-arr', 'hospital', 'green-500', '目的地', arrTime, 'green-400', window.makeWeatherBadgeHorizontal(wArr), dName);
    h += makeNode('msg-stay', 'teacup', 'purple-500', '滞在', (stayText || "---"), 'purple-300', '', '診察、買い物等');
    h += makeNode('msg-ret', 'home', 'gray-500', '自宅', retTime, 'gray-400', window.makeWeatherBadgeHorizontal(wRet), '帰宅');

    h += '</div>';
    return h;
  }

  window.showTimelineMsg = function(id, elNode) {
    var el = document.getElementById(id);
    if(el) {
      document.querySelectorAll('[id^="msg-"]').forEach(function(e){ 
        e.classList.remove('opacity-100'); e.classList.add('opacity-0'); 
        if(e.parentElement) e.parentElement.style.zIndex = '10';
      });
      if(elNode) elNode.style.zIndex = '100';
      
      el.classList.remove('opacity-0'); el.classList.add('opacity-100');
      setTimeout(function(){ 
        el.classList.remove('opacity-100'); el.classList.add('opacity-0'); 
        if(elNode) elNode.style.zIndex = '10';
      }, 3000);
    }
  }

  window.toggleTimelineCollapse = function() {
    var content = document.getElementById('timeline-collapse-content');
    var icon = document.getElementById('timeline-collapse-icon');
    if (content.classList.contains('opacity-0')) {
      content.classList.remove('opacity-0', 'scale-y-0', 'max-h-0', 'py-0', 'mt-0'); 
      content.classList.add('opacity-100', 'scale-y-100', 'max-h-[300px]', 'py-4', 'mt-2');
      icon.style.transform = 'rotate(180deg)';
    } else {
      content.classList.add('opacity-0', 'scale-y-0', 'max-h-0', 'py-0', 'mt-0'); 
      content.classList.remove('opacity-100', 'scale-y-100', 'max-h-[300px]', 'py-4', 'mt-2');
      icon.style.transform = 'rotate(0deg)';
    }
    if (isFirstStepCompleted) setTimeout(function(){ window.adjustInputContainerY(); }, 500);
  }

  window.animateTitle = function(newText) {
    var t = document.getElementById('nav-title'); if(!t) return;
    t.style.transition = 'transform 0.2s ease-in'; t.style.transform = 'translate(-50%, 0) rotateX(90deg)';
    setTimeout(function(){ t.innerText = newText; t.style.transition = 'transform 0.2s ease-out'; t.style.transform = 'translate(-50%, 0) rotateX(0deg)'; }, 200);
  }

  window.buildBadgeLayouts = function() {
    var mapping = [
      { id: '1', icon: 'hospital', label: '目的地' }, { id: '2', icon: 'calendar', label: '出発日' },
      { id: '3', icon: 'bus', label: 'バス停' }, { id: '4', icon: 'teacup', label: '滞在時間' },
      { id: 'route', icon: 'map', label: 'ルート選択' }, { id: 'weather', icon: 'weather', label: '天気予報' },
      { id: 'confirm', icon: 'send', label: 'カレンダー送信' } 
    ];
    mapping.forEach(function(item) {
      var btn = document.getElementById('badge-' + item.id);
      if (btn) {
        var wrap = btn.querySelector('.icon-wrap'), lbl = btn.querySelector('.badge-label');
        if (wrap) wrap.innerHTML = window.getSvgForIcon(item.icon, (item.icon==='weather'||item.id==='confirm' ? 'w-7 h-7' : 'w-8 h-8') + ' shrink-0 text-gray-100'); 
        if (lbl) lbl.innerText = item.label;
      }
    });
    var cb = document.getElementById('badge-cancel');
    if(cb) {
       var wrap = cb.querySelector('.icon-wrap'), lbl = cb.querySelector('.badge-label');
       if(wrap) wrap.innerHTML = window.getSvgForIcon('cancel', 'w-8 h-8 shrink-0 text-gray-400');
       if(lbl) lbl.innerText = "キャンセル";
    }
  }

  window.showConfirmModal = function() {
    var m = document.getElementById('confirm-modal'), b = document.getElementById('confirm-modal-box');
    m.classList.remove('hidden');
    requestAnimationFrame(function(){ m.classList.remove('opacity-0'); b.classList.remove('scale-95'); b.classList.add('scale-100'); });
  }
  
  window.closeConfirmModal = function(isYes) {
    var m = document.getElementById('confirm-modal'), b = document.getElementById('confirm-modal-box');
    m.classList.add('opacity-0'); b.classList.remove('scale-100'); b.classList.add('scale-95');
    setTimeout(function(){
      m.classList.add('hidden');
      if(isYes) { window.resetFormValues(); window.goToDeckScreen(); }
    }, 300);
  }

  window.goToFormScreen = function() {
    try {
      window.scrollTo(0, 0);

      window.resetFormValues();
      var deck = document.getElementById('screen-deck'), form = document.getElementById('screen-form');
      var backBtn = document.getElementById('nav-back-btn');
      var pDest = document.getElementById('preview-dest-area'), pTime = document.getElementById('timeline-area-wrapper'), pBadg = document.getElementById('badge-area'), fCon = document.getElementById('fab-container');

      if (pDest) pDest.style.display = 'none';
      if (pTime) pTime.style.display = 'none';
      if (pBadg) pBadg.style.display = 'none';

                      if(nS===5) window.startRouteSearch(); 
                    }); 
                    setTimeout(function() { var i = document.getElementById('input-container'); if(i) { var r = i.getBoundingClientRect(); if (r.bottom > window.innerHeight) window.scrollBy({ top: r.bottom - window.innerHeight + 24, behavior: 'smooth' }); } }, 150); 
                  });
                }); 
              }); return; 
          }
      }
      
      if(isE && s>=1 && s<=4) { 
          var z=64*(openEditPanels.indexOf(s)+1); 
          window.setTransformVarsDynamic(p,s,z,'suck'); setTimeout(function(){window.applyBadgeGreenPop(s);},600); 
          window.playAnimation(p,'anim-suck',700,function(){ 
            window.resetPanelStyles(p); window.closeEditPanel(s); window.enforceErrorPanels(); window.reorderEditPanels(); 
            if(!window.openErrorPanelIfNeeded()){window.adjustInputContainerY(); window.updateBadges(); window.validateStep();} 
          }); return; 
      }

      if(s===5) { 
          window.setTransformVarsDynamic(p,5,(isE?64*(openEditPanels.indexOf(5)+1):0),'suck'); setTimeout(function(){window.applyBadgeGreenPop(5);},600); 
          window.playAnimation(p,'anim-suck',700,function(){ 
            window.resetPanelStyles(p); isRouteDirty=false; if(hasSubmitted)isConfirmDirty=true; 
            var c=window.checkValuesChanged()||isWeatherDirty; 
            if(isE){ 
              window.closeEditPanel(5); window.enforceErrorPanels(); window.reorderEditPanels(); 
              if(c){isWeatherDirty=true; window.fetchWeather(true);} 
            } else { 
              maxReachedStep=6; currentStep=6; window.fetchWeather(false); 
            } 
            window.updateBadges(); 
            if(!isE){ 
              requestAnimationFrame(function(){
                requestAnimationFrame(function(){
                  var cP=document.getElementById('step-6'); if(!cP)return; 
                  window.preparePanelForAnimation(cP);
                  window.setTransformVarsDynamic(cP,6,0,'slide'); 
                  window.playAnimation(cP,'anim-slide-up-in',700,function(){ window.validateStep(); }); 
                  setTimeout(function(){window.adjustInputContainerY();},50); 
                  setTimeout(function() { var i = document.getElementById('input-container'); if(i) { var r = i.getBoundingClientRect(); if (r.bottom > window.innerHeight) window.scrollBy({ top: r.bottom - window.innerHeight + 24, behavior: 'smooth' }); } }, 150); 
                });
              }); 
            } else { 
              if(!c)window.adjustInputContainerY(); window.openErrorPanelIfNeeded(); 
            } 
          }); return; 
      }

      if(s==='weather') { 
          var z=64*(openEditPanels.indexOf(s)+1); 
          window.setTransformVarsDynamic(p,s,z,'suck'); setTimeout(function(){window.applyBadgeGreenPop(s);},600); 
          window.playAnimation(p,'anim-suck',700,function(){ 
            window.resetPanelStyles(p); window.closeEditPanel(s); window.enforceErrorPanels(); window.reorderEditPanels(); 
            window.adjustInputContainerY(); window.updateBadges(); window.validateStep(); 
          }); return; 
      }
    } catch(e) { if(s===1){currentStep=2;maxReachedStep=2;isFirstStepCompleted=true;window.tapBadge(2);}else if(s===2){currentStep=3;maxReachedStep=3;window.tapBadge(3);}else if(s===3){currentStep=4;maxReachedStep=4;window.tapBadge(4);}else if(s===4){currentStep=5;maxReachedStep=5;window.tapBadge(5);} }
  }

  window.tapBadge = function(t) {
    var bId=window.getBadgeIdStr(t), b=document.getElementById('badge-'+bId); if(!b||b.classList.contains('badge-wait')) return; 
    var q=window.getErrorQueue();
    if(q.length>0){ 
      if(t!==q[0]){ window.vibrateBadge(q[0]); return; } // 一番若い番号だけ揺らす
    } else { 
      if(editingStep!==null&&editingStep===t){ window.handlePanelButton(t); return; } 
      else if(editingStep!==null&&!window.canLeaveCurrentStep(editingStep)){ window.vibrateBadge(editingStep); return; } 
    }
    
    var idx=openEditPanels.indexOf(t);
    if(idx!==-1){ 
      // 🌟 バッジタップで戻す時も連動してエラーにする！
      if(window.checkValuesChanged()){
         if(maxReachedStep>=3) isBusDirty=true; 
         if(maxReachedStep>=5) {isRouteDirty=true; isWeatherDirty=true;}
         if(hasSubmitted) isConfirmDirty=true;
      }
      var eP=document.getElementById('step-'+window.getStepIdStr(t)); 
      if(eP){ var z=64*(idx+1); window.setTransformVarsDynamic(eP,t,z,'suck'); setTimeout(function(){window.applyBadgeGreenPop(t);},600); window.playAnimation(eP,'anim-suck',700,function(){window.resetPanelStyles(eP);window.closeEditPanel(t);window.enforceErrorPanels();window.reorderEditPanels();var iC=document.getElementById('input-container'); iC.style.transition='top 0.3s ease-out'; if(!window.openErrorPanelIfNeeded()){window.adjustInputContainerY();window.updateBadges();window.validateStep();}}); } return; 
    }
    
    if(editingStep===null){ var bP=document.getElementById('step-'+window.getStepIdStr(maxReachedStep)); if(bP)bP.style.zIndex='10'; window.captureOriginalValues(); }
    openEditPanels.push(t); editingStep=t; currentStep=t; window.updateBadges(); 
    var nP=document.getElementById('step-'+window.getStepIdStr(t)); 
    if(nP){ 
      window.preparePanelForAnimation(nP);
      nP.classList.add('edit-overlay'); nP.style.position='absolute'; nP.style.zIndex=1000+openEditPanels.length; 
      var tz=64*openEditPanels.length; window.setTransformVarsDynamic(nP,t,tz,'pop'); nP.style.transform=''; 
      if(t===5&&(isRouteDirty||!document.getElementById('route-candidates').innerHTML.includes('route-card')))window.startRouteSearch(); 
      var iC=document.getElementById('input-container'); iC.style.transition='top 0.3s ease-out'; window.adjustInputContainerY(); 
      window.playAnimation(nP,'anim-pop',700); 
      setTimeout(function() { var i = document.getElementById('input-container'); if(i) { var r = i.getBoundingClientRect(); if (r.bottom > window.innerHeight) window.scrollBy({ top: r.bottom - window.innerHeight + 24, behavior: 'smooth' }); } }, 150); 
    } window.validateStep();
  }

  window.cancelAllEdits = function() {
    if(openEditPanels.length===0) return; 
    var ba = document.getElementById('badge-area'); if(ba) window.scrollTo({ top: ba.getBoundingClientRect().top + window.pageYOffset - 75, behavior: 'smooth' }); 
    var q=window.getErrorQueue();
    if(q.length>0&&openEditPanels.length>q.length){ var tC=openEditPanels.filter(function(s){return !q.includes(s);}); if(tC.length===0){window.vibrateBadge(q[0]);return;} var c=0; tC.forEach(function(s){ var i=openEditPanels.indexOf(s); openEditPanels.splice(i,1); var p=document.getElementById('step-'+window.getStepIdStr(s)); if(p){window.setTransformVarsDynamic(p,s,64*i,'suck');setTimeout(function(){window.applyBadgeGreenPop(s);},600);window.playAnimation(p,'anim-suck',700,function(){window.resetPanelStyles(p);c++;if(c===tC.length){window.enforceErrorPanels();document.getElementById('input-container').style.transition='top 0.3s ease-out';window.adjustInputContainerY();}});}else{c++;} }); window.updateBadges(); return; }
    var tC=openEditPanels.slice(), cB=document.getElementById('badge-cancel'); if(cB)cB.disabled=true; openEditPanels=[]; editingStep=null; currentStep=maxReachedStep; var c=0, d=0, mD=(tC.length-1)*100+400;
    for(var i=tC.length-1;i>=0;i--){ (function(s,del,z){ setTimeout(function(){ var p=document.getElementById('step-'+window.getStepIdStr(s)); if(p){window.setTransformVarsDynamic(p,s,64*(z+1),'suck');setTimeout(function(){window.applyBadgeGreenPop(s);},600);window.playAnimation(p,'anim-suck',700,function(){window.resetPanelStyles(p);c++;if(c===tC.length){var bg=document.getElementById('step-'+window.getStepIdStr(currentStep));if(bg)bg.style.zIndex='20';document.getElementById('input-container').style.transition='top 0.3s ease-out';window.adjustInputContainerY();}});}else{c++;} },del); })(tC[i],d,i); d+=100; }
    setTimeout(function(){window.updateBadges();window.validateStep();},mD);
  }

  window.fetchWeather = function(isRe) {
    try {
      var dStr=document.getElementById('date-input').value, bS=document.getElementById('bus-time-select'), tStr=bS&&bS.value?bS.value:"12:00", dest=currentCandidate?currentCandidate.address:"";
      var dB=document.getElementById('weather-detail-content'), b=document.getElementById('badge-weather');
      if(!dStr||!dest)return; if(dB)dB.innerHTML='<div class="text-center w-full"><span class="animate-spin inline-block text-3xl">⏳</span><br/>取得中...</div>'; 
      if(b)b.dataset.completed='false';
      if(isRe)isWeatherDirty=true; else isWeatherDirty=false; window.updateBadges();
      
      var hS=function(r){ 
        if(r&&r.icon){ 
          var s=window.getSvgForWeather(r.icon); 
          if(dB){ 
            dB.innerHTML='<div class="flex-1 bg-gray-800 rounded-xl p-4 border border-gray-600 shadow-inner flex flex-col items-center"><div class="text-[12px] font-bold text-gray-400 mb-2">出発</div><div class="w-10 h-10 text-blue-300 mb-2 flex items-center justify-center">'+s+'</div><div class="text-2xl font-black text-white">'+r.temp+'℃</div></div>' +
                         '<div class="flex-1 bg-gray-800 rounded-xl p-4 border border-gray-600 shadow-inner flex flex-col items-center"><div class="text-[12px] font-bold text-gray-400 mb-2">到着</div><div class="w-10 h-10 text-green-400 mb-2 flex items-center justify-center">'+s+'</div><div class="text-2xl font-black text-white">'+r.temp+'℃</div></div>' +
                         '<div class="flex-1 bg-gray-800 rounded-xl p-4 border border-gray-600 shadow-inner flex flex-col items-center"><div class="text-[12px] font-bold text-gray-400 mb-2">帰宅</div><div class="w-10 h-10 text-purple-300 mb-2 flex items-center justify-center">'+s+'</div><div class="text-2xl font-black text-white">'+r.temp+'℃</div></div>'; 
          }
          window.previewWeatherStart = r.icon + " " + r.temp + "℃";
          window.previewWeatherArr = r.icon + " " + r.temp + "℃";
          isWeatherDirty=false; 
          if(b) b.dataset.completed='true';
          
          // 🌟 天気取得完了時に、時系列パネル（ミニバッジ）を即座に再描画する
          window.updatePreview(); 
          
          var cW=function(){ 
            var w=openEditPanels.indexOf('weather'); 
            if(w!==-1){
              openEditPanels.splice(w,1); 
              if(editingStep==='weather'){
                editingStep=openEditPanels.length>0?openEditPanels[openEditPanels.length-1]:null; 
                currentStep=editingStep||maxReachedStep;
              } 
              window.updateBadges(); 
              var wp=document.getElementById('step-weather'); 
              window.setTransformVarsDynamic(wp,'weather',64*w,'suck'); 
              setTimeout(function(){window.applyBadgeGreenPop('weather');},600); 
              window.playAnimation(wp,'anim-suck',700,function(){window.resetPanelStyles(wp);window.reorderEditPanels();window.adjustInputContainerY();});
            } else {
              window.updateBadges();
              if(!window.isEnforcingErrors) setTimeout(function(){ window.applyBadgeGreenPop('weather'); }, 200);
            } 
          };
          if(window.isEnforcingErrors) window.pendingWeatherClose=cW; else cW();
        } else { isWeatherDirty=true; window.updateBadges(); if(dB) dB.innerHTML='<div class="text-gray-400 p-4">取得失敗</div>'; }
      };
      if(typeof google!=='undefined') google.script.run.withSuccessHandler(hS).withFailureHandler(function(e){isWeatherDirty=true;window.updateBadges();if(dB)dB.innerHTML='<div class="text-red-400 p-4">通信エラー</div>';}).getWeatherForWeb(dest,dStr,tStr); else setTimeout(function(){hS({icon:"☀️",temp:"25"});},1200);
    } catch(e) { console.error("fetchWeather Error:", e); }
  }

  window.switchInnerTab = function(name) {
    ['master','search'].forEach(function(t){ var e=document.getElementById('tab-'+t); if(e)e.classList[t===name?'add':'remove']('active'); });
    var cOn="flex-1 text-white bg-blue-600 border-2 border-blue-400 font-extrabold py-4 text-2xl rounded-xl z-10 transition-colors flex items-center justify-center gap-2 shadow-lg";
    var cOff="flex-1 text-gray-400 bg-gray-800 border-2 border-gray-600 font-extrabold py-4 text-2xl rounded-xl z-10 transition-colors flex items-center justify-center gap-2";
    var mBtn=document.getElementById('tab-master-btn'), sBtn=document.getElementById('tab-search-btn');
    if(name==='master') {
      if(mBtn){mBtn.className=cOn; mBtn.innerHTML=window.getSvgForIcon('list','w-7 h-7 shrink-0')+'<span>一覧</span>';}
      if(sBtn){sBtn.className=cOff; sBtn.innerHTML=window.getSvgForIcon('search','w-7 h-7 shrink-0')+'<span>検索</span>';}
      window.onMasterSelect();
    } else {
      if(sBtn){sBtn.className=cOn; sBtn.innerHTML=window.getSvgForIcon('search','w-7 h-7 shrink-0')+'<span>検索</span>';}
      if(mBtn){mBtn.className=cOff; mBtn.innerHTML=window.getSvgForIcon('list','w-7 h-7 shrink-0')+'<span>一覧</span>';}
    }
  }

  window.onMasterSelect = function() {
    var selectEl = document.getElementById('master-select'); if(!selectEl) return;
    var idx=selectEl.value, aD=document.getElementById('master-address-display');
    if(idx===""){window.setCurrentCandidate(null); window.validateStep(); window.updateBadges(); if(aD)aD.classList.add('hidden'); return;}
    var item=masterDataList[idx]; if(aD){aD.innerText=item.address||"住所なし"; aD.classList.remove('hidden');}
    var b=document.getElementById('btn-next-1'); if(b)b.disabled=false; window.setCurrentCandidate(item);
    if(typeof google!=='undefined') google.script.run.withSuccessHandler(function(r){if(r.success&&r.data)window.setCurrentCandidate(r.data);}).getLatestPlaceDetails(String(item.placeId),String(item.name),String(item.address));
  }

  window.debounceSearch = function(e) {
    if(e&&e.isComposing)return; clearTimeout(searchTimeout);
    var cI=document.getElementById('city-input'), kI=document.getElementById('keyword-input');
    var cK=cI?cI.value.trim():"", mK=kI?kI.value.trim():""; if(cK)localStorage.setItem('kamp_city',cK);
    var p=document.getElementById('results-panel'), l=document.getElementById('candidates-list');
    if(mK.length<2){p.classList.add('hidden');return;} var fK=cK?(cK+" "+mK):mK; p.classList.remove('hidden'); l.innerHTML='<div class="text-xl text-gray-600 font-bold p-6 text-center animate-pulse">⏳ 探しています...</div>';
    searchTimeout=setTimeout(function(){
      if(typeof google!=='undefined') google.script.run.withSuccessHandler(function(r){if(r.success&&r.data.length>0)window.renderCandidates(r.data);else l.innerHTML='<div class="text-xl text-red-500 font-bold p-6 text-center">見つかりませんでした</div>';}).executeWebSearch(fK);
      else window.renderCandidates([{placeId:"mock1",name:"あさか医療センター",address:"埼玉県"+cK+"1-1",bizHours:"月曜:09:00〜18:00"},{placeId:"mock2",name:"青柳診療所",address:"埼玉県"+cK+"2-2",bizHours:"毎日:10:00〜20:00"}]);
    },700);
  }

  window.renderCandidates = function(cands) {
    var l=document.getElementById('candidates-list'); l.innerHTML="";
    cands.forEach(function(c){ 
      var d=document.createElement('div'); d.className="flex flex-col p-5 border-b-2 border-gray-300 hover:bg-blue-100 active:bg-blue-200 cursor-pointer transition-colors"; 
      d.innerHTML='<span class="font-bold text-blue-900 text-2xl mb-2">'+c.name+'</span><span class="text-gray-600 text-sm leading-tight">'+c.address+'</span>'; 
      d.onclick=function(){
        var b=document.getElementById('btn-next-1'); if(b) b.disabled=false; 
        window.setCurrentCandidate(c); document.getElementById('results-panel').classList.add('hidden'); 
        var kI=document.getElementById('keyword-input'); if(kI) kI.value=c.name; 
        setTimeout(function(){window.handlePanelButton(1);},100);
      }; l.appendChild(d); 
    });
  }

  window.setCurrentCandidate = function(c) {
    currentCandidate=c; 
    if(c){ 
      var m=String(c.address||""), bN=""; 
      if(m){var p=m.split(/[\s ]+/);if(p.length>1){m=p[0]; bN=p.slice(1).join(" ");}} 
      currentCandidate.parsedAddress=m; currentCandidate.parsedBuilding=bN||c.building||""; 
      currentCandidate.parsedPhone=String(c.phone||"").replace(/^\+81\s?/,'0')||"---"; 
      currentCandidate.parsedBiz=String(c.bizHours||"---"); 
    } 
    window.updatePreview(); window.validateStep(); window.updateBadges();
  }

  window.initAppUI = function() {
    try{ var nT = document.getElementById('nav-title'); if(nT){ nT.classList.remove('flex-1'); nT.className += " absolute left-1/2 -translate-x-1/2"; } } catch(e){}
    try { document.getElementById('step-1-icon').innerHTML = window.getSvgForIcon('hospital', 'w-6 h-6 text-white'); document.getElementById('step-2-icon').innerHTML = window.getSvgForIcon('calendar', 'w-6 h-6 text-white'); document.getElementById('step-3-icon').innerHTML = window.getSvgForIcon('bus', 'w-6 h-6 text-white'); document.getElementById('step-4-icon').innerHTML = window.getSvgForIcon('teacup', 'w-6 h-6 text-white'); document.getElementById('step-5-icon').innerHTML = window.getSvgForIcon('map', 'w-6 h-6 text-white'); document.getElementById('step-weather-icon').innerHTML = window.getSvgForIcon('weather', 'w-6 h-6 text-white'); document.getElementById('step-6-icon').innerHTML = window.getSvgForIcon('send', 'w-6 h-6 text-gray-300'); } catch(e) {}
    window.buildBadgeLayouts();
    try{ var m=document.getElementById('tab-master-btn'), s=document.getElementById('tab-search-btn'); if(m&&m.innerHTML.indexOf('<svg')===-1)m.innerHTML=window.getSvgForIcon('list','w-7 h-7 shrink-0')+'<span>一覧</span>'; if(s&&s.innerHTML.indexOf('<svg')===-1)s.innerHTML=window.getSvgForIcon('search','w-7 h-7 shrink-0')+'<span>検索</span>'; }catch(e){}
    window.loadDeckList();
    if(typeof google!=='undefined') google.script.run.withSuccessHandler(function(l){masterDataList=l;var s=document.getElementById('master-select');if(s){s.innerHTML='<option value="">▼ 選んでください</option>';for(var i=0;i<l.length;i++){var o=document.createElement('option');o.value=i;o.text=l[i].name;s.appendChild(o);}}}).getMasterListForWeb(); else {masterDataList=[{placeId:"m1",name:"あさか医療センター",address:"埼玉県朝霞市溝沼1340-1",bizHours:"月曜:09:00〜18:00"},{placeId:"m2",name:"青柳診療所",address:"埼玉県朝霞市本町2-13-6",bizHours:"毎日:10:00〜20:00"}];var sel=document.getElementById('master-select');if(sel){sel.innerHTML='<option value="">▼ 選んでください</option>';for(var i=0;i<masterDataList.length;i++){var opt=document.createElement('option');opt.value=i;opt.text=masterDataList[i].name;sel.appendChild(opt);}}}
  }

  document.addEventListener("DOMContentLoaded", function() { window.initAppUI(); });
  window.onload = function() { window.initAppUI(); };
</script>
