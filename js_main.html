<script>
  /**
   * ==========================================
   * js_main.html (全アニメーション・連動エラー完全撃破版 + Pattern A 独立判定)
   * ==========================================
   */
  document.addEventListener("touchstart", function(){}, {passive: true});
  var masterDataList=[], currentCandidate=null, searchTimeout=null, currentStep=1, maxReachedStep=1, isFirstStepCompleted=false, editingStep=null, openEditPanels=[], selectedRouteIndex=null;
  var isDateDirty=false, isBusDirty=false, isRouteDirty=false, isConfirmDirty=false, isWeatherDirty=false, hasSubmitted=false;
  window.lastFetchedDate=null; window.isEnforcingErrors=false; window.pendingWeatherClose=null;
  window.photoCache = {};
  var originalValues={}, selectedCards=[], isSelectionMode=false, pressTimer=null, touchStartX=0, touchStartY=0;
  
  window.selectedRouteDuration = 15;
  window.selectedRouteFirstWalk = 5;
  window.selectedRouteDepStop = "宮戸橋";
  window.selectedRouteArrStop = "目的地最寄り";
  window.currentRouteData = [];

  window.loadCityHistory = function() {
    var hist = JSON.parse(localStorage.getItem('city_history') || '[]');
    var dl = document.getElementById('city-history');
    if (dl) {
      dl.innerHTML = '';
      hist.forEach(function(c) { var opt = document.createElement('option'); opt.value = c; dl.appendChild(opt); });
    }
    var ci = document.getElementById('city-input');
    if (ci && hist.length > 0 && !ci.value) ci.value = hist[0];
  }
  window.saveCityHistory = function(city) {
    if (!city) return;
    var hist = JSON.parse(localStorage.getItem('city_history') || '[]');
    hist = hist.filter(function(c) { return c !== city; });
    hist.unshift(city);
    if (hist.length > 10) hist.pop();
    localStorage.setItem('city_history', JSON.stringify(hist));
    window.loadCityHistory();
  }
  window.clearCityHistory = function() {
    localStorage.removeItem('city_history');
    var ci = document.getElementById('city-input');
    if(ci) ci.value = '';
    window.loadCityHistory();
  }
  window.deleteCityHistory = function(city) {
    var hist = JSON.parse(localStorage.getItem('city_history') || '[]');
    hist = hist.filter(function(c) { return c !== city; });
    localStorage.setItem('city_history', JSON.stringify(hist));
    window.renderCityDropdown();
  }
  window.saveCityOnBlur = function() {
    var cI = document.getElementById('city-input');
    var cK = cI ? cI.value.trim() : ""; 
    if(cK) { window.saveCityHistory(cK); }
  }
  window.handleCityKey = function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      var cI = document.getElementById('city-input');
      var cK = cI ? cI.value.trim() : ""; 
      if(cK) { window.saveCityHistory(cK); window.closeCityDropdown(); }
    }
  }
  window.openCityDropdown = function() {
    var dd = document.getElementById('city-dropdown');
    if(dd) { dd.classList.remove('hidden'); dd.classList.add('flex'); window.renderCityDropdown(); }
  }
  window.closeCityDropdown = function() {
    var dd = document.getElementById('city-dropdown');
    if(dd) { dd.classList.add('hidden'); dd.classList.remove('flex'); }
  }
  window.toggleCityDropdown = function() {
    var dd = document.getElementById('city-dropdown');
    if(dd && dd.classList.contains('hidden')) window.openCityDropdown(); else window.closeCityDropdown();
  }
  window.renderCityDropdown = function() {
    var hist = JSON.parse(localStorage.getItem('city_history') || '[]');
    var dd = document.getElementById('city-dropdown');
    if (!dd) return;
    dd.innerHTML = '';
    if (hist.length === 0) {
      dd.innerHTML = '<div class="p-4 text-gray-500 text-center font-bold text-sm">履歴がありません</div>';
    } else {
      hist.forEach(function(city) {
        var item = document.createElement('div');
        item.className = "flex justify-between items-center px-4 py-3 border-b border-gray-700 hover:bg-gray-700 cursor-pointer text-gray-200 font-bold active:bg-gray-600";
        var textSpan = document.createElement('span');
        textSpan.innerText = city;
        textSpan.className = "flex-1 text-lg";
        textSpan.onclick = function(e) {
           e.stopPropagation();
           document.getElementById('city-input').value = city;
           window.closeCityDropdown();
           window.debounceSearch({type:'change'}); 
        };
        var delBtn = document.createElement('button');
        delBtn.innerHTML = "✕";
        delBtn.className = "text-gray-500 hover:text-red-400 font-black w-10 h-10 flex items-center justify-center rounded-full active:bg-gray-800 text-lg";
        delBtn.onclick = function(e) {
           e.stopPropagation();
           window.deleteCityHistory(city);
        };
        item.appendChild(textSpan);
        item.appendChild(delBtn);
        dd.appendChild(item);
      });
    }
  }
  document.addEventListener('click', function(e) {
      var ci = document.getElementById('city-input');
      var tg = document.getElementById('city-dropdown-toggle');
      var dd = document.getElementById('city-dropdown');
      if(ci && tg && dd) {
          if(!ci.contains(e.target) && !tg.contains(e.target) && !dd.contains(e.target)) {
              window.closeCityDropdown();
          }
      }
  });
  window.revertSingleEdit = function(step) {
    if (step === 1) window.setCurrentCandidate(originalValues.candObj);
    else if (step === 2) {
      document.getElementById('date-input').value = originalValues.step2;
      window.lastFetchedDate = originalValues.step2; 
    }
    else if (step === 3) document.getElementById('bus-time-select').value = originalValues.step3;
    else if (step === 4) window.setStayTime(originalValues.step4);
    else if (step === 5) window.selectRouteCard(originalValues.step5);
    
    var p = document.getElementById('step-'+window.getStepIdStr(step));
    if(p) {
      var idx = openEditPanels.indexOf(step);
      var z = 64 * (idx + 1);
      window.setTransformVarsDynamic(p, step, z, 'suck');
      window.playAnimation(p, 'anim-suck', 700, function(){
        window.resetPanelStyles(p);
        window.closeEditPanel(step);
        window.reorderEditPanels();
        window.adjustInputContainerY();
        window.updatePreview();
        window.updateBadges();
        window.validateStep();
      });
    }
  }
  window.captureOriginalValues = function() {
    window.calculateDistance = function(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLon = (lon2 - lon1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return 6371 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))); // km
  }
  window.timeToMinutes = function(timeStr) {
    if (!timeStr || timeStr.indexOf(':') === -1) return 0;
    var p = timeStr.replace(/'/g, '').split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }
  window.stayToMinutes = function(stayStr) {
    if (!stayStr) return 0;
    var h = parseInt(stayStr.replace('時間',''), 10);
    return isNaN(h) ? 0 : h * 60;
  }
    originalValues = { 
      step1: currentCandidate ? currentCandidate.placeId : null, 
      candObj: currentCandidate ? JSON.parse(JSON.stringify(currentCandidate)) : null,
      lat: currentCandidate ? currentCandidate.lat : null,
      lng: currentCandidate ? currentCandidate.lng : null,
      step2: document.getElementById('date-input').value, 
      step3: document.getElementById('bus-time-select').value, 
      step4: document.getElementById('stay-select').value,
      step5: selectedRouteIndex,
      dayType: window.currentDayInfo ? window.currentDayInfo.dayType : null,
      busTimesStr: window.currentDayInfo ? window.currentDayInfo.busTimes.join(',') : "",
      arrivalTime: window.calculatedTimesRaw ? window.calculatedTimesRaw.arr : null
    };
  }
  window.checkBusNeedsUpdate = function() {
    if (originalValues.step2 === document.getElementById('date-input').value) return false;
    var oldDayType = originalValues.dayType;
    var newDayType = window.currentDayInfo ? window.currentDayInfo.dayType : null;
    if (oldDayType && newDayType && oldDayType === newDayType) return false;
    return true;
  }
  
  window.checkRouteNeedsUpdate = function() {
    var c = currentCandidate || {};
    var oldPlaceId = originalValues.step1 || "";
    var newPlaceId = c.placeId || "";
    var isDestChanged = false;

    if (oldPlaceId !== newPlaceId) {
        isDestChanged = true;
        // 🌟 100m(0.1km)以内の変更はルート再検索対象外とする
        if (c.lat && originalValues.lat && window.calculateDistance(originalValues.lat, originalValues.lng, c.lat, c.lng) <= 0.1) {
            isDestChanged = false;
        } else if (originalValues.candObj) {
            var oldName = (originalValues.candObj.name || "").trim();
            var newName = (c.name || "").trim();
            var oldAddr = (originalValues.candObj.parsedAddress || originalValues.candObj.address || "").split(/[0-9\-]/)[0].trim();
            var newAddr = (c.parsedAddress || c.address || "").split(/[0-9\-]/)[0].trim();
            if (oldName && newName && (oldName.indexOf(newName) !== -1 || newName.indexOf(oldName) !== -1)) isDestChanged = false;
            else if (oldAddr && newAddr && oldAddr === newAddr) isDestChanged = false;
        }
    }
    
    var oldDate = originalValues.step2 || "";
    var newDate = document.getElementById('date-input').value;
    var isDateChanged = (oldDate !== newDate);
    
    var oldDayType = originalValues.dayType;
    var newDayType = window.currentDayInfo ? window.currentDayInfo.dayType : null;
    if (isDateChanged && oldDayType && newDayType && oldDayType === newDayType) {
        isDateChanged = false;
    }
    
    var oldBus = originalValues.step3 || "";
    var newBus = document.getElementById('bus-time-select').value;
    var isBusChanged = (oldBus !== newBus);
    
    return (isDestChanged || isDateChanged || isBusChanged);
  }
  
  window.checkWeatherNeedsUpdate = function() {
    var isDestChanged = false;
    var c = currentCandidate || {};
    var oldCandStr = originalValues.candObj ? JSON.stringify(originalValues.candObj) : "";
    var newCandStr = JSON.stringify(c);
    
    if (oldCandStr !== newCandStr) {
        isDestChanged = true;
        if (c.lat && originalValues.lat && window.calculateDistance(originalValues.lat, originalValues.lng, c.lat, c.lng) <= 5.0) {
            isDestChanged = false;
        }
    }
    
    var isDateChanged = true;
    var oldDayType = originalValues.dayType;
    var newDayType = window.currentDayInfo ? window.currentDayInfo.dayType : null;
    if (originalValues.step2 === document.getElementById('date-input').value) isDateChanged = false;
    else if (oldDayType && newDayType && oldDayType === newDayType) isDateChanged = false;
    
    var isBusChanged = (originalValues.step3 !== document.getElementById('bus-time-select').value);
    
    return (isDestChanged || isDateChanged || isBusChanged);
  }
  
  window.checkWeatherNeedsUpdate = function() {
    var isDestChanged = false;
    var c = currentCandidate || {};
    var oldPlaceId = originalValues.step1 || "";
    var newPlaceId = c.placeId || "";
    
    if (oldPlaceId !== newPlaceId) {
        isDestChanged = true;
        if (c.lat && originalValues.lat && window.calculateDistance(originalValues.lat, originalValues.lng, c.lat, c.lng) <= 5.0) {
            isDestChanged = false;
        } else if (originalValues.candObj) {
           var oldName = (originalValues.candObj.name || "").trim();
           var newName = (c.name || "").trim();
           var oldAddr = (originalValues.candObj.parsedAddress || originalValues.candObj.address || "").split(/[0-9\-]/)[0].trim(); 
           var newAddr = (c.parsedAddress || c.address || "").split(/[0-9\-]/)[0].trim();
           if (oldName && newName && (oldName.indexOf(newName) !== -1 || newName.indexOf(oldName) !== -1)) isDestChanged = false;
           else if (oldAddr && newAddr && oldAddr === newAddr) isDestChanged = false;
        }
    }
    
    if (originalValues.step2 !== document.getElementById('date-input').value) return true;
    
    var oldArr = window.timeToMinutes(originalValues.arrivalTime);
    var newArr = window.timeToMinutes(window.calculatedTimesRaw ? window.calculatedTimesRaw.arr : "");
    if (Math.abs(newArr - oldArr) >= 180) return true;
    
    var oldStay = window.stayToMinutes(originalValues.step4);
    var newStay = window.stayToMinutes(document.getElementById('stay-select').value);
    if (Math.abs(newStay - oldStay) >= 180) return true;
    
    return isDestChanged;
  }
  window.checkValuesChanged = function() {
    return (originalValues.step1 !== (currentCandidate ? currentCandidate.placeId : null) || originalValues.step2 !== document.getElementById('date-input').value || originalValues.step3 !== document.getElementById('bus-time-select').value || originalValues.step4 !== document.getElementById('stay-select').value || originalValues.step5 !== selectedRouteIndex);
  }
  window.preparePanelForAnimation = function(panel) {
    if(!panel) return;
    panel.classList.remove('hidden');
    panel.style.display = 'flex';
    panel.style.visibility = 'hidden';
    panel.style.opacity = '0';
  };
  window.showToast = function(msg) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.innerText = msg;
    toast.classList.add('toast-show');
    setTimeout(function() { toast.classList.remove('toast-show'); }, 3000);
  };
  window.getSvgForWeather = function(iconOrCode) {
    if (!iconOrCode) return window.getSvgForIcon('weather', 'w-8 h-8');
    if (iconOrCode.includes("📅") || iconOrCode.includes("--")) return '<span class="text-3xl font-black text-gray-400 mt-2">--</span>';
    var icon = iconOrCode.split(/\s+/)[0];
    return '<span class="text-3xl">' + icon + '</span>';
  };
  window.startRouteSearch = function() {
    var routeCandidatesDiv = document.getElementById('route-candidates');
    var btnNextRoute = document.getElementById('btn-next-route');
    if (!routeCandidatesDiv) return;
    if (!currentCandidate || !document.getElementById('date-input').value || !document.getElementById('bus-time-select').value) {
      routeCandidatesDiv.innerHTML = '<div class="text-amber-400 font-bold p-4 text-center w-full">目的地・出発日・バス時間を先に設定してください</div>';
      selectedRouteIndex = null;
      window.validateStep();
      if (btnNextRoute) btnNextRoute.disabled = true;
      return;
    }
    routeCandidatesDiv.innerHTML = '<div class="text-gray-400 font-bold p-8 text-center w-full flex flex-col items-center justify-center"><span class="animate-spin text-3xl mb-2 select-none outline-none" style="user-select:none;">⏳</span><span>最適ルートを検索中...</span></div>';
    if (btnNextRoute) btnNextRoute.disabled = true;
    var dateStr = document.getElementById('date-input').value;
    var timeStr = document.getElementById('bus-time-select').value;
    var destAddr = currentCandidate.address || currentCandidate.parsedAddress;
    var successHandler = function(res) {
      if (res && res.success && res.routes && res.routes.length > 0) {
        var h = "";
        window.currentRouteData = res.routes;
        res.routes.forEach(function(route, idx) {
          var isSelected = (selectedRouteIndex === idx);
          var selectedClass = isSelected ? "selected" : "";
          h += '<div class="route-card ' + selectedClass + '" onclick="window.selectRouteCard(' + idx + ')">';
          
          h += '<div class="flex items-center justify-between mb-3 border-b border-gray-700 pb-2">';
          h += '<span class="text-blue-400 font-black text-lg">ルート ' + (idx + 1) + ' <span class="text-sm text-gray-400 font-medium ml-1">(' + (route.totalDurationText || (route.durationMinutes+'分')) + ' / ' + (route.totalDistanceText || '--') + 'km)</span></span>';
          h += '</div>';
          
          h += '<div class="relative pl-8 border-l-[3px] border-gray-600 ml-4 space-y-6 my-6 py-2">';
          if (route.stepsList && route.stepsList.length > 0) {
            route.stepsList.forEach(function(st, sIdx) {
              var isBus = (st.type === "バス");
              var isTrain = (st.type === "電車");
              var isWalk = (st.type === "徒歩");
              
              var iconHtml = "";
              if (isBus) { iconHtml = window.getSvgForIcon('bus', 'w-7 h-7 text-blue-400'); }
              else if (isTrain) { iconHtml = window.getSvgForIcon('train-front', 'w-7 h-7 text-emerald-400'); }
              else { iconHtml = window.getSvgForIcon('walk', 'w-7 h-7 text-gray-400'); }
              
              var colorClass = isBus ? "blue" : (isTrain ? "emerald" : "gray");
              var borderColorClass = isBus ? "border-blue-500/60" : (isTrain ? "border-emerald-500/60" : "border-gray-500");
              
              h += '<div class="relative flex items-center min-h-[64px] py-1">';
              h += '<div class="absolute -left-[70px] top-1/2 -translate-y-1/2 flex flex-col items-center w-[72px] z-10">';
              h += '<div class="w-[46px] h-[46px] rounded-full bg-gray-950 border-[3px] ' + borderColorClass + ' flex items-center justify-center shadow-lg relative z-10">' + iconHtml + '</div>';
              
              if (!isWalk && st.line) {
                 var badgeColorClass = isBus ? "text-blue-100 bg-blue-900/80 border-blue-600/50" : "text-emerald-100 bg-emerald-900/80 border-emerald-600/50";
                 h += '<div class="text-[10px] font-bold ' + badgeColorClass + ' mt-1.5 relative z-20 px-1 py-0.5 rounded-md border text-center leading-tight whitespace-pre-wrap shadow-sm w-[64px]">' + st.line + '</div>';
              }
              h += '</div>';
              
              h += '<div class="ml-5 w-full">';
              if (isWalk) {
                 h += '<div class="flex items-center text-[15px] font-black text-gray-200 ml-1 tracking-wide"><span class="text-gray-500 mr-4">徒歩</span>' + st.duration + '</div>';
              } else {
                 h += '<div class="flex items-stretch bg-gray-800/40 rounded-xl border border-gray-700/60 shadow-md overflow-hidden">';
                 h += '<div class="flex flex-col justify-center items-center px-2 py-3 bg-gray-800/80 border-r border-gray-700/60 min-w-[68px]">';
                 h += '<span class="text-[11px] font-bold text-gray-400 mb-1">' + st.type + '</span>';
                 h += '<span class="text-[15px] font-black text-' + colorClass + '-400">' + st.duration + '</span>';
                 h += '</div>';
                 h += '<div class="flex flex-col justify-center px-4 py-3 flex-1 min-w-0">';
                 h += '<div class="text-[14px] font-bold text-gray-100 truncate">' + st.dep + '</div>';
                 h += '<div class="my-1.5 ml-1"><svg class="w-4 h-4 text-' + colorClass + '-500/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 5v14m-7-7l7 7 7-7"></path></svg></div>';
                 h += '<div class="text-[14px] font-bold text-gray-100 truncate">' + st.arr + '</div>';
                 h += '</div>';
                 h += '</div>';
              }
              h += '</div>';
              h += '</div>';
            });
          } else {
            h += '<div class="text-sm text-gray-300 whitespace-pre-wrap font-medium leading-relaxed">' + (route.summary || '') + '</div>';
          }
          h += '</div>';
          h += '</div>';
        });
        routeCandidatesDiv.innerHTML = h;
        if (selectedRouteIndex === null || selectedRouteIndex >= res.routes.length) {
          window.selectRouteCard(0);
        } else {
          window.selectRouteCard(selectedRouteIndex);
        }
      } else {
        routeCandidatesDiv.innerHTML = '<div class="text-red-400 font-bold p-6 text-center w-full">該当ルートが見つかりませんでした。<br><span class="text-xs text-gray-500 font-normal">' + (res ? res.message : '通信エラー') + '</span></div>';
        if (btnNextRoute) btnNextRoute.disabled = true;
      }
      
      window.adjustInputContainerY();
      setTimeout(function() {
        var i = document.getElementById('input-container'); 
        if(i) { 
          var r = i.getBoundingClientRect(); 
          if (r.bottom > window.innerHeight) window.scrollBy({ top: r.bottom - window.innerHeight + 24, behavior: 'smooth' }); 
        }
      }, 150);
    };
    
    var failHandler = function(err) {
      routeCandidatesDiv.innerHTML = '<div class="text-red-400 font-bold p-6 text-center w-full">ルート取得に失敗しました</div>';
      if (btnNextRoute) btnNextRoute.disabled = true;
      window.adjustInputContainerY();
    };
    if (typeof google !== 'undefined') {
      google.script.run.withSuccessHandler(successHandler).withFailureHandler(failHandler).getRoutesForWeb(dateStr, timeStr, destAddr);
    } else {
      setTimeout(function() {
        successHandler({
          success: true,
          routes: [
            { 
              summary: "バス (朝01) [宮戸橋  ⇨  朝霞駅南口]\n⇩\n徒歩 3分\n(15分 / 3.2km)", 
              totalDurationText: "15分", totalDistanceText: "3.2",
              stepsList: [
                 { type: "徒歩", duration: "2分" },
                 { type: "バス", line: "朝01", dep: "宮戸橋", arr: "朝霞駅南口", duration: "10分" },
                 { type: "電車", line: "東武東上線", dep: "朝霞台駅", arr: "朝霞駅", duration: "3分" },
                 { type: "徒歩", duration: "3分" }
              ],
              durationMinutes: 15, firstWalkMinutes: 2, depStop: "宮戸橋", arrStop: "朝霞駅南口" 
            },
            { 
              summary: "バス (朝02) [宮戸橋  ⇨  市内循環]\n⇩\n徒歩 5分\n(20分 / 3.8km)", 
              totalDurationText: "20分", totalDistanceText: "3.8",
              stepsList: [
                 { type: "バス", line: "朝02", dep: "宮戸橋", arr: "あさか医療センター前", duration: "15分" },
                 { type: "徒歩", duration: "5分" }
              ],
              durationMinutes: 20, firstWalkMinutes: 8, depStop: "宮戸橋", arrStop: "あさか医療センター前" 
            }
          ]
        });
      }, 800);
    }
  };
  window.selectRouteCard = function(idx) {
    selectedRouteIndex = idx;
    var rcContainer = document.getElementById('route-candidates');
    if (!rcContainer) return;
    var cards = rcContainer.querySelectorAll('.route-card');
    cards.forEach(function(card, i) {
      if (i === idx) card.classList.add('selected');
      else card.classList.remove('selected');
    });
    if (window.currentRouteData && window.currentRouteData[idx]) {
      var route = window.currentRouteData[idx];
      window.selectedRouteDuration = route.durationMinutes;
      window.selectedRouteFirstWalk = route.firstWalkMinutes || 5;
      window.selectedRouteDepStop = route.depStop || "宮戸橋";
      window.selectedRouteArrStop = route.arrStop || "目的地最寄り";
    }
    window.validateStep();
    window.updatePreview();
    window.updateBadges();
  };
  window.getStepIdStr = function(s) { return s === 'weather' ? 'weather' : String(s); }
  window.getBadgeIdStr = function(s) { return s === 'weather' ? 'weather' : (s === 5 ? 'route' : (s === 6 ? 'confirm' : String(s))); }
  window.getErrorQueue = function() {
    var q = [];
    if(isBusDirty) q.push(3); 
    if(isRouteDirty) q.push(5); 
    if(isWeatherDirty) q.push('weather'); 
    if(isConfirmDirty) q.push(6);
    
    // 初回入力中のものは除外（エラーとして扱わない）
    if (!window.isEditingExisting && !hasSubmitted) {
        q = q.filter(function(step) { return step !== maxReachedStep; });
    }
    return q;
  }
  window.openErrorPanelIfNeeded = function() {
    var q = window.getErrorQueue(); 
    if(q.length > 0) { 
        if(openEditPanels.indexOf(q[0]) === -1) {
            window.tapBadge(q[0]); 
        } else {
            editingStep = q[0];
            currentStep = q[0];
            if(q[0] === 5) {
                window.startRouteSearch();
            }
            if(q[0] === 'weather') {
                    window.fetchWeather(true);
                }
                window.updateBadges();
            }
            return true; 
        } 
        return false;
      }
  window.formatTimeNoZero = function(timeStr) {
    if(!timeStr || timeStr.trim() === "" || timeStr === "--:--") return "--:--";

  window.getHorizontalTimelineHTML = function(startTime, busTime, arrTime, wStart, wBus, wArr, stayText, retTime, wRet) {

  window.showTimelineMsg = function(id, elNode) {

      document.querySelectorAll('[id^="msg-"]').forEach(function(e){ 
        e.classList.remove('opacity-100'); e.classList.add('opacity-0'); 
        if(e.parentElement) e.parentElement.style.zIndex = '10';
      });
      if(elNode) elNode.style.zIndex = '100';
      
      el.classList.remove('opacity-0'); el.classList.add('opacity-100');
      setTimeout(function(){

      }, 3000);
    }

  window.toggleTimelineCollapse = function() {

      content.classList.remove('opacity-0', 'scale-y-0', 'max-h-0', 'py-0', 'mt-0'); 
      content.classList.add('opacity-100', 'scale-y-100', 'max-h-[300px]', 'py-4', 'mt-2');

      icon.style.transform = 'rotate(0deg)';
    }

      var start = Date.now();
      var timer = setInterval(function() {

  window.goToFormScreen = function(editItem) {
    try {
      window.scrollTo(0, 0);
      window.resetFormValues();
      var deck = document.getElementById('screen-deck'), form = document.getElementById('screen-form');
      var backBtn = document.getElementById('nav-back-btn');
      var pDest = document.getElementById('preview-dest-area'), pTime = document.getElementById('timeline-area-wrapper'), pBadg = document.getElementById('badge-area'), fCon = document.getElementById('fab-container');
      
      if (fCon) { fCon.classList.add('hidden'); }
      var mainWrapper = document.getElementById('main-wrapper');
      if (mainWrapper) mainWrapper.style.minHeight = 'auto';
      var iC = document.getElementById('input-container');
      if (iC) { 
          iC.style.opacity = '1'; 
          iC.style.pointerEvents = 'auto';
          iC.style.position = 'relative'; 
          iC.style.top = '0px'; 
          iC.style.height = 'auto'; 
      }
      if (deck) {
        deck.style.display = 'none';
        deck.classList.add('hidden');
        deck.classList.remove('flex');
        deck.style.position = 'relative';
      }
      if (form) {
        form.style.display = 'flex';
        form.classList.remove('hidden'); 
        form.classList.add('flex');
        window.playAnimation(form, 'anim-fade-in', 200); 
      }
      if(backBtn) { backBtn.classList.remove('hidden'); backBtn.classList.add('flex'); }
      var hdTabs = document.getElementById('deck-tabs'); if (hdTabs) hdTabs.style.display = 'none';
      var hdTitle = document.getElementById('nav-title'); if (hdTitle) hdTitle.classList.remove('hidden');
      if (editItem) {
         window.animateTitle("予定の変更");
         document.getElementById('edit-unique-id').value = editItem.id || "";
         document.getElementById('edit-event-id').value = editItem.eventId || "";
         
         window.currentCandidate = {
           placeId: editItem.placeId, name: editItem.name, address: editItem.address, parsedAddress: editItem.address, 
           lat: editItem.lat, lng: editItem.lng, postal: editItem.postal, building: editItem.building, phone: editItem.phone, 
           website: editItem.website, bizHours: editItem.bizHours
         };

         // マスタに存在するかチェックしてUIを復元
         var foundInMaster = -1;
         if (window.masterDataList) {
           for (var i = 0; i < window.masterDataList.length; i++) {
             if (window.masterDataList[i].placeId === editItem.placeId && editItem.placeId !== "") {
               foundInMaster = i; break;
             }
           }
         }
         if (foundInMaster !== -1) {
           var ms = document.getElementById('master-select');
           if (ms) ms.selectedIndex = foundInMaster + 1; // 1番目は"▼ 選択"
           window.switchInnerTab('master');
           var aD = document.getElementById('master-address-display');
           if (aD) {
             aD.innerText = (editItem.address || "") + " " + (editItem.building || "");
             aD.classList.remove('hidden');
           }
         } else {
           window.switchInnerTab('search');
           var ki = document.getElementById('keyword-input');
           if (ki) ki.value = editItem.name;
           window.renderCandidates([window.currentCandidate]);
           var l = document.getElementById('candidates-list');
           if (l && l.firstElementChild) l.firstElementChild.classList.add('selected');
         }

         if(editItem.date) {
            var d = editItem.date.replace(/\//g, '-');
            document.getElementById('date-input').value = d;
            var bs = document.getElementById('bus-time-select');
            if(bs) {
              bs.innerHTML = '<option value="">▼ 選択</option>';
              var opt = document.createElement('option'); opt.value = editItem.busTime; opt.text = editItem.busTime;
              bs.appendChild(opt);
              bs.value = editItem.busTime;
            }
            window.lastFetchedDate = null;
         }
         
         if(editItem.stayTime) {
            document.getElementById('stay-select').value = editItem.stayTime;
            document.querySelectorAll('.stay-btn').forEach(function(b) { 
               b.classList.remove('bg-blue-600', 'text-white', 'border-blue-400'); 
               b.classList.add('bg-gray-800', 'text-gray-300', 'border-gray-600'); 
               if(b.innerText.trim() === editItem.stayTime.trim()) {
                   b.classList.add('bg-blue-600', 'text-white', 'border-blue-400');
                   b.classList.remove('bg-gray-800', 'text-gray-300', 'border-gray-600');
               }
            });
         }
         
         if(editItem.routeData) {
            try {
              window.currentRouteData = [JSON.parse(editItem.routeData)];
              selectedRouteIndex = 0;
              var route = window.currentRouteData[0];
              window.selectedRouteDuration = route.durationMinutes;
              window.selectedRouteFirstWalk = route.firstWalkMinutes;
              window.selectedRouteDepStop = route.depStop;
              window.selectedRouteArrStop = route.arrStop;
              
              var rcDiv = document.getElementById('route-candidates');
              if (rcDiv) {
                 var h = '<div class="route-card selected" onclick="window.selectRouteCard(0)">';
                 h += '<div class="flex items-center justify-between mb-3 border-b border-gray-700 pb-2">';
                 h += '<span class="text-blue-400 font-black text-lg">保存済みルート <span class="text-sm text-gray-400 font-medium ml-1">(' + (route.totalDurationText || (route.durationMinutes+'分')) + ' / ' + (route.totalDistanceText || '--') + 'km)</span></span>';
                 h += '</div>';
                 h += '<div class="relative pl-8 border-l-[3px] border-gray-600 ml-4 space-y-6 my-6 py-2">';
                 if (route.stepsList && route.stepsList.length > 0) {

                     var isBus = (st.type === "バス");
                     var isTrain = (st.type === "電車");

  window.toggleCardSelection = function(cardEl, itemId) {

    var delAllContainer = document.getElementById('fab-del-all-container');

      var wrappers = document.querySelectorAll('.deck-card-wrapper');

  window.renderDeckItems = function() {
    var deckListDiv = document.getElementById('deck-list'); if(!deckListDiv) return;
    // タブ切り替え時のみ、描画完了を待ってからアニメーションを確実に追加

            if(window.isEnforcingErrors) {
                window.isEnforcingErrors = false;
                setTimeout(function(){ window.enforceErrorPanels(); }, 400);
            } else {
                window.openErrorPanelIfNeeded();
            }
          } else {
            var w = openEditPanels.indexOf('weather'); 
            openEditPanels.splice(w, 1); 
            if(editingStep === 'weather'){
              editingStep = openEditPanels.length > 0 ? openEditPanels[openEditPanels.length-1] : null; 
              currentStep = editingStep || maxReachedStep;
            } 
            window.updateBadges();
            var wp = document.getElementById('step-weather'); 
            window.setTransformVarsDynamic(wp, 'weather', 64*w, 'suck'); 
            setTimeout(function(){ window.applyBadgeGreenPop('weather'); }, 600); 
            window.playAnimation(wp, 'anim-suck', 700, function(){
                window.resetPanelStyles(wp);
                window.reorderEditPanels();
                window.adjustInputContainerY();
                if (!window.openErrorPanelIfNeeded()) {
                    window.updateBadges();
                    window.validateStep();
                }
            });
          }
        } else { 
            isWeatherDirty=true; window.updateBadges(); 
            if(dB) dB.innerHTML='<div class="text-gray-400 p-4">取得失敗</div>'; 
            if (btn) { btn.disabled = false; btn.innerHTML = '閉じる'; btn.classList.remove('bg-gray-800', 'border-gray-600', 'text-gray-400'); btn.classList.add('bg-gray-700', 'text-white'); }
        }
      };
      if(typeof google!=='undefined') google.script.run.withSuccessHandler(hS).withFailureHandler(function(e){ window.isFetchingWeather=false; window.validateStep(); isWeatherDirty=true; window.updateBadges(); if(dB)dB.innerHTML='<div class="text-red-400 p-4">通信エラー</div>'; if(btn){btn.disabled=false;btn.innerHTML='閉じる';btn.classList.remove('bg-gray-800', 'border-gray-600', 'text-gray-400'); btn.classList.add('bg-gray-700', 'text-white');}}).getWeatherForWeb(dest,dStr,t1,t2,t3); else setTimeout(function(){hS({start:{icon:"☀️",temp:"25"},arr:{icon:"⛅",temp:"26"},ret:{icon:"🌧️",temp:"20"}});},1200);
    } catch(e) { console.error("fetchWeather Error:", e); }
  }
  window.switchInnerTab = function(name) {
    ['master','search'].forEach(function(t){ 
      var e=document.getElementById('tab-'+t); 
      if(e){
        if(t===name){ e.classList.add('active'); e.classList.remove('hidden'); e.classList.add('flex'); }
        else { e.classList.remove('active'); e.classList.add('hidden'); e.classList.remove('flex'); }
      }
    });
    var cOn="flex-1 text-white bg-blue-600 border-2 border-blue-400 font-extrabold py-4 text-2xl rounded-xl z-10 transition-colors flex items-center justify-center gap-2 shadow-lg";
    var cOff="flex-1 text-gray-400 bg-gray-800 border-2 border-gray-600 font-extrabold py-4 text-2xl rounded-xl z-10 transition-colors flex items-center justify-center gap-2";
    var mBtn=document.getElementById('tab-master-btn'), sBtn=document.getElementById('tab-search-btn');
    var tabBg=document.getElementById('tab-bg');
    if(name==='master') {
      if(tabBg) tabBg.style.transform='translateX(0)';
      if(mBtn){mBtn.className=cOn; mBtn.innerHTML=window.getSvgForIcon('list','w-7 h-7 shrink-0')+'<span>一覧</span>';}
      if(sBtn){sBtn.className=cOff; sBtn.innerHTML=window.getSvgForIcon('search','w-7 h-7 shrink-0')+'<span>検索</span>';}
      window.onMasterSelect();
    } else {
      if(tabBg) tabBg.style.transform='translateX(100%)';
      if(sBtn){sBtn.className=cOn; sBtn.innerHTML=window.getSvgForIcon('search','w-7 h-7 shrink-0')+'<span>検索</span>';}
      if(mBtn){mBtn.className=cOff; mBtn.innerHTML=window.getSvgForIcon('list','w-7 h-7 shrink-0')+'<span>一覧</span>';}
    }
  }
  window.onMasterSelect = function() {
    var selectEl = document.getElementById('master-select'); if(!selectEl) return;
    var mr = document.getElementById('master-reg-wrap'); if(mr) { mr.classList.remove('flex'); mr.classList.add('hidden'); }
    var idx=selectEl.value, aD=document.getElementById('master-address-display');
    if(idx===""){window.setCurrentCandidate(null); window.validateStep(); window.updateBadges(); if(aD)aD.classList.add('hidden'); return;}
    var item=masterDataList[idx]; 
    if(aD){
      aD.innerText = (item.address || "") + " " + (item.building || ""); 
      aD.classList.remove('hidden');
    }
    var b=document.getElementById('btn-next-1'); if(b)b.disabled=false; window.setCurrentCandidate(item);
    if(typeof google!=='undefined') google.script.run.withSuccessHandler(function(r){if(r.success&&r.data)window.setCurrentCandidate(r.data);}).getLatestPlaceDetails(String(item.placeId),String(item.name),String(item.address));
  }
  window.debounceSearch = function(e) {
    if(e&&e.isComposing)return; clearTimeout(searchTimeout);
    var cI=document.getElementById('city-input'), kI=document.getElementById('keyword-input');
    var cK=cI?cI.value.trim():"", mK=kI?kI.value.trim():""; 
    
    var p=document.getElementById('results-panel'), l=document.getElementById('candidates-list'), mr=document.getElementById('master-reg-wrap');
    if(mr) { mr.classList.remove('flex'); mr.classList.add('hidden'); }
    if(mK.length<2){p.classList.add('hidden');return;}
    var fK=cK?(cK+" "+mK):mK; p.classList.remove('hidden'); 
    l.innerHTML='<div class="text-xl text-gray-400 font-bold p-6 text-center animate-pulse w-full select-none outline-none" style="user-select:none;">⏳ 探しています...</div>';
    searchTimeout=setTimeout(function(){
      if(typeof google!=='undefined') google.script.run.withSuccessHandler(function(r){if(r.success&&r.data.length>0)window.renderCandidates(r.data);else l.innerHTML='<div class="text-xl text-red-500 font-bold p-6 text-center w-full">見つかりませんでした</div>';}).executeWebSearch(fK);
      else window.renderCandidates([{placeId:"mock1",name:"ダミー施設1",address:"埼玉県"+cK+"1-1",bizHours:"月曜:09:00〜18:00"},{placeId:"mock2",name:"ダミー施設2",address:"埼玉県"+cK+"2-2",bizHours:"毎日:10:00〜20:00"},{placeId:"mock3",name:"ダミー施設3",address:"埼玉県"+cK+"3-3"}]);
    },700);
  }
  window.renderCandidates = function(cands) {
    var l=document.getElementById('candidates-list'); l.innerHTML="";
    var top3 = cands.slice(0, 3);
    top3.forEach(function(c, idx){ 
      var d=document.createElement('div'); 
      d.className="route-card flex-col flex justify-between"; 
      d.innerHTML='<div><span class="font-bold text-blue-400 text-xl block mb-2">' + c.name + '</span><span class="text-gray-300 text-sm leading-tight block">' + c.address + '</span></div>'; 
      d.onclick=function(){
        Array.from(l.children).forEach(function(child){ child.classList.remove('selected'); });
        d.classList.add('selected');
        var b=document.getElementById('btn-next-1'); if(b) b.disabled=false; 
        window.setCurrentCandidate(c); 
        var isExist = false;
        if (masterDataList) {
           for(var i=0; i<masterDataList.length; i++) {
              if(String(masterDataList[i].placeId) === String(c.placeId) && String(c.placeId) !== "") { isExist = true; break; }
           }
        }
        var mr = document.getElementById('master-reg-wrap'), cb = document.getElementById('master-reg-check');
        if (mr) {
           if (isExist) {
             mr.classList.remove('flex'); mr.classList.add('hidden');
             if(cb) cb.checked = false;
           } else {
             mr.classList.remove('hidden'); mr.classList.add('flex');
             if(cb) cb.checked = false; // デフォルトでOFFにする
           }
        }
        window.adjustInputContainerY();
      }; l.appendChild(d); 
    });
  }
  window.setCurrentCandidate = function(c) {
    currentCandidate=c; 
    if(c){ 
      var rawAddr = String(c.address||"").replace(/〒?\d{3}-\d{4}\s?/, "").trim();
      var m = rawAddr, bN = ""; 
      if(m){var p=m.split(/[\s ]+/);if(p.length>1){m=p[0]; bN=p.slice(1).join(" ");}} 
      currentCandidate.parsedAddress=m; currentCandidate.parsedBuilding=bN||c.building||""; 
      currentCandidate.parsedPhone=String(c.phone||"").replace(/^\+81\s?/,'0'); 
      if(!currentCandidate.parsedPhone || currentCandidate.parsedPhone==="---" || currentCandidate.parsedPhone==="登録なし") currentCandidate.parsedPhone="未登録";
      currentCandidate.parsedBiz=String(c.bizHours||""); 
      if(!currentCandidate.parsedBiz || currentCandidate.parsedBiz==="---") currentCandidate.parsedBiz="未登録";
      if(!currentCandidate.website || currentCandidate.website==="---" || currentCandidate.website==="登録なし") currentCandidate.website="未登録";
    } 
    window.updatePreview(); window.validateStep(); window.updateBadges();
  }
  window.openSettingsMenu = function() {
    var m = document.getElementById('settings-menu-modal'), b = document.getElementById('settings-menu-box');
    m.classList.remove('hidden');
    requestAnimationFrame(function(){ m.classList.remove('opacity-0'); b.classList.remove('scale-95'); b.classList.add('scale-100'); });
  }
  window.closeSettingsMenu = function() {
    var m = document.getElementById('settings-menu-modal'), b = document.getElementById('settings-menu-box');
    m.classList.add('opacity-0'); b.classList.remove('scale-100'); b.classList.add('scale-95');
    setTimeout(function(){ m.classList.add('hidden'); }, 300);
  }
  
  window.selectedMasterItems = [];
  
  window.openMasterManage = function() {
    window.closeSettingsMenu();
    var m = document.getElementById('master-manage-modal'), b = document.getElementById('master-manage-box');
    m.classList.remove('hidden');
    requestAnimationFrame(function(){ m.classList.remove('opacity-0'); b.classList.remove('scale-95'); b.classList.add('scale-100'); });

  window.closeMasterManage = function() {
    var m = document.getElementById('master-manage-modal'), b = document.getElementById('master-manage-box');

    setTimeout(function(){ m.classList.add('hidden'); }, 300);
  }
  
  window.renderMasterManageList = function() {
    var cont = document.getElementById('master-list-container');
    if(!cont) return;
    cont.innerHTML = '<div class="text-center py-10 text-gray-500"><span class="animate-spin inline-block text-3xl mb-2">⏳</span><p class="text-sm font-bold">読込中...</p></div>';
    
    google.script.run.withSuccessHandler(function(list) {
       if(!list || list.length === 0) {
           cont.innerHTML = '<div class="text-center py-10 text-gray-500 font-bold">マスタデータがありません</div>';
           return;
       }
       window.masterDataList = list;
       var h = '';
       list.forEach(function(item) {
           var isSelected = window.selectedMasterItems.includes(item.placeId);
           var borderCls = isSelected ? 'border-red-500 bg-red-950/30 scale-95' : 'border-gray-700 bg-gray-800';
           
           h += '<div id="master-card-' + item.placeId + '" class="rounded-xl border-2 ' + borderCls + ' p-3 transition-all duration-200 cursor-pointer shadow-md overflow-hidden" onclick="window.toggleMasterSelection(\'' + item.placeId + '\')">';
           h += '<div class="font-black text-white text-lg mb-2 truncate">' + item.name + '</div>';
           
           h += '<div class="flex flex-row gap-3 overflow-x-auto no-scrollbar pb-2 snap-x snap-mandatory">';
           var addBox = function(label, text, color) {
              if(!text || text === "未登録") return "";
              return '<div class="min-w-[140px] bg-gray-900 border border-gray-700 rounded-lg p-2 flex flex-col justify-center snap-center shrink-0">' +
                     '<span class="text-[10px] font-bold text-' + color + '-400 mb-0.5">' + label + '</span>' +
                     '<span class="text-xs font-bold text-gray-200 whitespace-pre-wrap leading-snug">' + text + '</span></div>';
           };
           h += addBox('住所', (item.postal ? '〒'+item.postal+'\n' : '') + item.address + (item.building ? '\n'+item.building : ''), 'blue');
           h += addBox('営業時間', item.bizHours, 'yellow');
           h += addBox('電話番号', item.phone, 'emerald');
           h += addBox('WEB', item.website, 'purple');
           h += addBox('PlaceID', item.placeId, 'gray');
           h += '</div></div>';
       });
       cont.innerHTML = h;
    }).getMasterListForWeb();
  }
  
  window.toggleMasterSelection = function(placeId) {
     var idx = window.selectedMasterItems.indexOf(placeId);
     var card = document.getElementById('master-card-' + placeId);
     if (idx > -1) {
         window.selectedMasterItems.splice(idx, 1);
         if(card) { card.classList.remove('border-red-500', 'bg-red-950/30', 'scale-95'); card.classList.add('border-gray-700', 'bg-gray-800'); }
     } else {
         window.selectedMasterItems.push(placeId);
         if(card) { card.classList.add('border-red-500', 'bg-red-950/30', 'scale-95'); card.classList.remove('border-gray-700', 'bg-gray-800'); }
     }
     var fab = document.getElementById('master-fab-container');
     var cnt = document.getElementById('master-fab-count');
     if (window.selectedMasterItems.length > 0) {
         if(cnt) cnt.innerText = window.selectedMasterItems.length;
         if(fab) { fab.classList.remove('hidden'); fab.classList.add('flex'); }
     } else {
         if(fab) { fab.classList.add('hidden'); fab.classList.remove('flex'); }
     }
  }
  
  window.executeDeleteMasterSelected = function() {
     if(window.selectedMasterItems.length === 0) return;
     var m = document.getElementById('delete-master-modal'), b = document.getElementById('delete-master-modal-box');
     m.classList.remove('hidden');
     requestAnimationFrame(function(){ m.classList.remove('opacity-0'); b.classList.remove('scale-95'); b.classList.add('scale-100'); });
  }
  
  window.confirmDeleteMaster = function(isYes) {
     var m = document.getElementById('delete-master-modal'), b = document.getElementById('delete-master-modal-box');
     if (!isYes) {
         m.classList.add('opacity-0'); b.classList.remove('scale-100'); b.classList.add('scale-95');
         setTimeout(function(){ m.classList.add('hidden'); }, 300);
         return;
     }
     
     var btn = document.getElementById('btn-del-master-yes');
     if(btn) { btn.innerHTML = '<span class="animate-spin inline-block text-xl">⏳</span>'; btn.disabled = true; }
     
     google.script.run.withSuccessHandler(function(res) {
         m.classList.add('opacity-0'); b.classList.remove('scale-100'); b.classList.add('scale-95');
         setTimeout(function(){ m.classList.add('hidden'); if(btn){ btn.innerHTML = 'はい'; btn.disabled = false; } }, 300);
         
         if(res.success) {
             window.showToast(res.count + "件削除しました");
             window.selectedMasterItems = [];
             var fab = document.getElementById('master-fab-container');
             if(fab) { fab.classList.add('hidden'); fab.classList.remove('flex'); }
             window.renderMasterManageList();
             window.initAppUI(); 
         } else {
             window.showToast("削除エラー");
         }
     }).deleteMasterItemsWeb(window.selectedMasterItems);
  }
  window.openTemplateSettings = function() {

    var m = document.getElementById('tmpl-modal'), b = document.getElementById('tmpl-modal-box');
    m.classList.remove('hidden');
    requestAnimationFrame(function(){ m.classList.remove('opacity-0'); b.classList.remove('scale-95'); b.classList.add('scale-100'); });
    
    var btn = document.getElementById('tmpl-save-btn');
    btn.innerHTML = '<span class="animate-spin inline-block mr-2 select-none">⏳</span>読込中...';

       document.getElementById('tmpl-location').value = res.location;
       document.getElementById('tmpl-desc').value = res.description;
       btn.innerHTML = '保存する';

  window.closeTemplateSettings = function() {
    var m = document.getElementById('tmpl-modal'), b = document.getElementById('tmpl-modal-box');
    m.classList.add('opacity-0'); b.classList.remove('scale-100'); b.classList.add('scale-95');
    setTimeout(function(){ m.classList.add('hidden'); }, 300);
  }

  window.openSpreadsheet = function(btn) {
    if(btn) { btn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span>取得中...'; btn.disabled = true; }
    google.script.run.withSuccessHandler(function(url) {
       if(btn) { 
          btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>スプレッドシートを開く'; 
          btn.disabled = false; 
       }
       if(url) window.open(url, '_blank');
       else window.showToast("スプレッドシートのURL取得に失敗しました");
    }).getSpreadsheetUrl();

    btn.disabled = true;

       title: document.getElementById('tmpl-title').value,

    };

  window.initAppUI = function() {
    try { document.getElementById('step-1-icon').innerHTML = window.getSvgForIcon('hospital', 'w-6 h-6 text-white'); document.getElementById('step-2-icon').innerHTML = window.getSvgForIcon('calendar', 'w-6 h-6 text-white'); document.getElementById('step-3-icon').innerHTML = window.getSvgForIcon('bus', 'w-6 h-6 text-white'); document.getElementById('step-4-icon').innerHTML = window.getSvgForIcon('teacup', 'w-6 h-6 text-white'); document.getElementById('step-5-icon').innerHTML = window.getSvgForIcon('map', 'w-6 h-6 text-white'); document.getElementById('step-weather-icon').innerHTML = window.getSvgForIcon('weather', 'w-6 h-6 text-white'); document.getElementById('step-6-icon').innerHTML = window.getSvgForIcon('send', 'w-6 h-6 text-gray-300'); } catch(e) {}
    window.buildBadgeLayouts();
    window.loadCityHistory();
    try{ var m=document.getElementById('tab-master-btn'), s=document.getElementById('tab-search-btn'); if(m&&m.innerHTML.indexOf('<svg')===-1)m.innerHTML=window.getSvgForIcon('list','w-7 h-7 shrink-0')+'<span>一覧</span>'; if(s&&s.innerHTML.indexOf('<svg')===-1)s.innerHTML=window.getSvgForIcon('search','w-7 h-7 shrink-0')+'<span>検索</span>'; }catch(e){}
    window.loadDeckList();
    if(typeof google!=='undefined') {
       google.script.run.withSuccessHandler(function(l){masterDataList=l;var s=document.getElementById('master-select');if(s){s.innerHTML='<option value="">▼ 選択</option>';for(var i=0;i<l.length;i++){var o=document.createElement('option');o.value=i;o.text=l[i].name;s.appendChild(o);}}}).getMasterListForWeb();
       google.script.run.withSuccessHandler(function(list){
          var sel = document.getElementById('cal-account-select');
          if(sel && list && list.length > 0) {
             sel.innerHTML = '';
             list.forEach(function(item) {
                var opt = document.createElement('option');
                opt.value = item.value;
                opt.text = item.name;
                sel.appendChild(opt);
             });
          }
       }).getCalendarMasterForWeb();
    } else {
       masterDataList=[{placeId:"m1",name:"ダミーマスタ1",address:"埼玉県ダミー市1-1",bizHours:"月曜:09:00〜18:00"},{placeId:"m2",name:"ダミーマスタ2",address:"埼玉県ダミー市2-2",bizHours:"毎日:10:00〜20:00"}];var sel=document.getElementById('master-select');if(sel){sel.innerHTML='<option value="">▼ 選択</option>';for(var i=0;i<masterDataList.length;i++){var opt=document.createElement('option');opt.value=i;opt.text=masterDataList[i].name;sel.appendChild(opt);}}
    }
  }
  document.addEventListener("DOMContentLoaded", function() { window.initAppUI(); });
  window.onload = function() { window.initAppUI(); };
  // 誤操作（戻る・リロード等）防止のためのブラウザ標準警告
  window.addEventListener('beforeunload', function(e) {
    e.preventDefault();
    e.returnValue = '';
  });
